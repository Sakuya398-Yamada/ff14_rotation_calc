<!DOCTYPE html>
<html lang="ja" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FF14 Rotation Calculator - スキル回しの威力計算ツール</title>
    <meta
      name="description"
      content="FF14 のジョブのスキル回しをタイムラインに並べ、合計の期待威力・PPS・DoT の威力を計算するツールです。"
    />
    <!--
      og:url と rel="canonical" は書かない。共有 URL（/t/<id>）にもこの HTML を返すので、/ に固定すると
      SNS や検索エンジンが共有 URL をトップページとして扱う。書かなければ、開いた URL そのものが使われる（#837）
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FF14 Rotation Calculator" />
    <meta property="og:title" content="FF14 Rotation Calculator - スキル回しの威力計算ツール" />
    <meta
      property="og:description"
      content="FF14 のジョブのスキル回しをタイムラインに並べ、合計の期待威力・PPS・DoT の威力を計算するツールです。"
    />
    <meta property="og:image" content="https://ff14-rotation-calc.forestry-for.workers.dev/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
